seed_everything: 7
trainer:
  checkpoint_callback: true
  callbacks:
    - class_path: pytorch_lightning.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
    - class_path: pytorch_lightning.callbacks.ModelCheckpoint
      init_args:
        save_top_k: 1
        monitor: val_ExpRate
        mode: max
        filename: '{epoch}-{step}-{val_ExpRate:.4f}'
  # gpus: 1
  gpus: 1
  accelerator: ddp
  check_val_every_n_epoch: 1
  max_epochs: 300
  deterministic: true
  val_check_interval: 0.01
  limit_val_batches: 1.0
  num_sanity_val_steps: 0
  resume_from_checkpoint: null

wandb:
 name: "origin_hme100k"
 project: "SwinCOMER"
 log_model: "all"

model:
  d_model: 64
  # encoder
  growth_rate: 24
  num_layers: 16
  # decoder
  nhead: 8
  num_decoder_layers: 3
  dim_feedforward: 128
  dropout: 0.3
  dc: 32
  cross_coverage: false
  self_coverage: false
  # beam search
  beam_size: 10
  max_len: 200
  alpha: 1.0
  early_stopping: false
  temperature: 1.0
  # training
  learning_rate: 0.0004
  patience: 20
  cosine_scheduler:
    T_0: 2250 # 2250
    T_mult: 4
    eta_min: 0.000075
data:
  zipfile_path: data
  test_year: "2014"
  train_batch_size: 2
  eval_batch_size: 2
  num_workers: 4
  scale_aug: true
